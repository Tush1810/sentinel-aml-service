server:
  port: 8081

spring:
  application:
    name: sentinel-aml
  datasource:
    url: ${SENTINEL_DB_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${SENTINEL_DB_USER:catalog}
    password: ${SENTINEL_DB_PASSWORD:catalog}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: sentinel-ingestion
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.tushar.hackathon.*"
    producer:
      acks: all

logging:
  level:
    com.tushar.hackathon: DEBUG

sentinel:
  fx:
    base-currency: INR
    rates:
      INR: 1.0
      USD: 83.50
      EUR: 90.20
      GBP: 105.40
      AED: 22.74
      SGD: 62.10

  kafka:
    enabled: ${SENTINEL_KAFKA_ENABLED:true}
    topic: sentinel.transactions
